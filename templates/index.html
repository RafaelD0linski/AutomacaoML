<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Afiliado ML - Link + WhatsApp</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00a650, #007bff);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 95%;
      max-width: 500px;
      text-align: center;
    }
    textarea {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      background-color: #00a650;
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    button:hover {
      background-color: #009245;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔗 Gerador Automático ML + WhatsApp</h2>
    <textarea id="texto" rows="4" placeholder="Cole o link do produto (e uma descrição opcional)..."></textarea>
    <button onclick="gerarEEnviar()">Gerar e Enviar no WhatsApp</button>
  </div>

  <script>
    function gerarEEnviar() {
      const texto = document.getElementById("texto").value.trim();
      if (!texto) {
        alert("Cole o link do produto primeiro!");
        return;
      }

      const regex = /(https?:\/\/[^\s]+)/g;
      const links = texto.match(regex);
      if (!links || links.length === 0) {
        alert("Nenhum link válido encontrado.");
        return;
      }

      const linkOriginal = links[0];

      // Cria um redirecionador "seu" (simulando o clique afiliado)
      // Ele aponta para o seu perfil de afiliado e leva ao produto
      const linkAfiliado = `https://www.mercadolivre.com.br/social/rafael_dolinski?redirect=${encodeURIComponent(linkOriginal)}`;

      // Mensagem final
      const mensagemFinal = texto.replace(linkOriginal, linkAfiliado);
      const textoCodificado = encodeURIComponent(mensagemFinal);

      // Abre WhatsApp automaticamente
      const url = `https://wa.me/?text=${textoCodificado}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
