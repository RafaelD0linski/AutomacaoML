<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Link de Afiliado ML</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #00a650, #007bff);
      min-height: 100vh;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      width: 95%;
      max-width: 500px;
      text-align: center;
    }
    h2 {
      color: #007bff;
      margin-bottom: 15px;
    }
    textarea, input {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 10px;
    }
    button {
      background-color: #00a650;
      color: white;
      border: none;
      padding: 12px 20px;
      margin-top: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      width: 100%;
    }
    button:hover {
      background-color: #009245;
    }
    .result {
      margin-top: 15px;
      background: #f5f5f5;
      padding: 10px;
      border-radius: 8px;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>🔗 Gerador de Link de Afiliado (Mercado Livre)</h2>
    <textarea id="texto" rows="4" placeholder="Cole o link do produto e opcionalmente adicione uma descrição..."></textarea>
    <button onclick="gerarLink()">Gerar Link</button>
    <div id="resultado" class="result"></div>
    <button id="btnWpp" style="display:none;" onclick="abrirWhatsApp()">📲 Enviar no WhatsApp</button>
  </div>

  <script>
    let linkAfiliado = "";

    function gerarLink() {
      const texto = document.getElementById("texto").value.trim();
      if (!texto) {
        alert("Cole o link do produto primeiro!");
        return;
      }

      // Captura o link do produto Mercado Livre
      const regex = /(https?:\/\/[^\s]+)/g;
      const links = texto.match(regex);
      if (!links || links.length === 0) {
        alert("Nenhum link válido encontrado.");
        return;
      }

      const linkOriginal = links[0];
      const linkAfiliadoFinal = linkOriginal.includes("?")
        ? linkOriginal + "&matt_tool=MLA&campid=rafael_dolinski"
        : linkOriginal + "?matt_tool=MLA&campid=rafael_dolinski";

      // Substitui o link original pelo afiliado
      const mensagemFinal = texto.replace(linkOriginal, linkAfiliadoFinal);

      document.getElementById("resultado").innerHTML =
        `<b>Link gerado:</b><br>${mensagemFinal}`;
      document.getElementById("btnWpp").style.display = "block";
      linkAfiliado = mensagemFinal;
    }

    function abrirWhatsApp() {
      const textoCodificado = encodeURIComponent(linkAfiliado);
      const url = `https://wa.me/?text=${textoCodificado}`;
      window.open(url, "_blank");
    }
  </script>
</body>
</html>
